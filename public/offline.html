<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión · Horas Extras</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #171717; text-align: center; padding: 24px; }

  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />

      <button onclick="location.reload()">Reintentar</button>
    </div>

</html>
